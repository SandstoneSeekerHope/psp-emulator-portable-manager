<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3ad6ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1487c9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1487c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4150"/>
      <stop offset="45%" stop-color="#232833"/>
      <stop offset="100%" stop-color="#14171e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2b3d"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd8ff"/>
      <stop offset="50%" stop-color="#2f7fa8"/>
      <stop offset="100%" stop-color="#123044"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fe8ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- soft ambient glow behind device -->
  <circle cx="930" cy="185" r="220" fill="url(#screenGlow)" opacity="0.5"/>

  <!-- faint grid lines suggesting digital/tech environment -->
  <g stroke="#1e2a3a" stroke-width="1" opacity="0.5">
    <line x1="60" y1="60" x2="1140" y2="60"/>
    <line x1="60" y1="300" x2="1140" y2="300"/>
    <line x1="700" y1="20" x2="700" y2="340"/>
    <line x1="850" y1="20" x2="850" y2="340"/>
  </g>

  <!-- portability path: dashed line connecting device silhouettes -->
  <g opacity="0.55">
    <path d="M120,300 C300,260 420,320 560,270 C680,230 780,270 880,220" fill="none" stroke="#3ad6ff" stroke-width="2" stroke-dasharray="6 8"/>
  </g>

  <!-- small device icons along path (phone, tablet, tv) -->
  <g fill="none" stroke="#4fd8ff" stroke-width="2" opacity="0.85">
    <rect x="105" y="285" width="20" height="32" rx="4"/>
    <rect x="545" y="255" width="30" height="22" rx="3"/>
    <rect x="860" y="200" width="36" height="24" rx="2"/>
  </g>

  <!-- === PSP handheld device === -->
  <g transform="translate(870,180)">
    <!-- body -->
    <rect x="-170" y="-95" width="340" height="190" rx="45" fill="url(#body)" stroke="#050608" stroke-width="3"/>
    <!-- top highlight -->
    <rect x="-170" y="-95" width="340" height="40" rx="45" fill="#4a5262" opacity="0.25"/>

    <!-- screen -->
    <rect x="-95" y="-58" width="190" height="116" rx="10" fill="url(#screen)" stroke="#0e2635" stroke-width="2"/>
    <rect x="-95" y="-58" width="190" height="116" rx="10" fill="url(#screenGlow)" opacity="0.55"/>

    <!-- screen content: mini game scene -->
    <g opacity="0.9">
      <polygon points="-70,40 -30,-10 10,20 50,-30 78,40" fill="#173a4d"/>
      <circle cx="-40" cy="-20" r="10" fill="#9fe8ff" opacity="0.8"/>
      <rect x="-60" y="28" width="140" height="14" fill="#0a1a24"/>
    </g>

    <!-- left nub / d-pad -->
    <g transform="translate(-142,0)" fill="#0d0f13" stroke="#3ad6ff" stroke-width="1.5">
      <circle r="18"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#4fd8ff" stroke-width="3"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#4fd8ff" stroke-width="3"/>
    </g>

    <!-- right action buttons -->
    <g transform="translate(142,0)" fill="#0d0f13" stroke="#3ad6ff" stroke-width="1.2">
      <circle cx="0" cy="-14" r="7"/>
      <circle cx="14" cy="0" r="7"/>
      <circle cx="0" cy="14" r="7"/>
      <circle cx="-14" cy="0" r="7"/>
    </g>

    <!-- speaker slits -->
    <g stroke="#40495a" stroke-width="2">
      <line x1="-30" y1="70" x2="-10" y2="70"/>
      <line x1="10" y1="70" x2="30" y2="70"/>
    </g>
  </g>

  <!-- UMD disc floating near device, tilted -->
  <g transform="translate(1050,90) rotate(18)">
    <ellipse cx="0" cy="0" rx="46" ry="46" fill="url(#disc)" stroke="#0a1622" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#0a1622"/>
    <circle cx="0" cy="0" r="6" fill="#3ad6ff"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="66" fill="url(#headGrad)">
    <tspan x="60" y="150" textLength="620" lengthAdjust="spacingAndGlyphs">PSP Emulator</tspan>
    <tspan x="60" y="228" textLength="380" lengthAdjust="spacingAndGlyphs">Portable</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a9c4d6" textLength="700" lengthAdjust="spacingAndGlyphs">
    Render and play PSP games portably across devices
  </text>
  <text x="60" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a9c4d6" textLength="380" lengthAdjust="spacingAndGlyphs">
    with no installation required
  </text>

  <!-- accent underline -->
  <rect x="60" y="238" width="140" height="4" rx="2" fill="#3ad6ff" opacity="0.8"/>
</svg>